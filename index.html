<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="운동기록">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>운동기록</title>
</head>
<body>
  <header class="topbar">
    <div class="title-row">
      <span></span>
      <h1 id="title">운동기록</h1>
      <button id="header-action" class="pill" hidden></button>
    </div>
    <div id="subheader"></div>
  </header>

  <main id="view"></main>

  <button id="fab" class="primary fab" hidden>＋ 운동 추가</button>

  <nav class="tabbar">
    <button class="tab" data-tab="log">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 10v4M5 7v10M8 8v8M8 12h8M16 8v8M19 7v10M22 10v4"/></svg>
      <span>기록</span>
    </button>
    <button class="tab" data-tab="calendar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span>캘린더</span>
    </button>
    <button class="tab" data-tab="export">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>
      <span>내보내기</span>
    </button>
  </nav>

  <div id="sheet" class="sheet" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <input id="restore-input" type="file" accept=".json,application/json" hidden>

  <script src="app.js"></script>
</body>
</html>
