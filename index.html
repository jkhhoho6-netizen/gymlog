<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="운동기록">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>운동기록</title>
</head>
<body>
  <header class="topbar">
    <div class="title-row">
      <button id="header-timer" class="pill timer-pill" hidden aria-label="휴식 타이머 시작">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="14" r="7.5"/><path d="M12 10.5V14l2.5 1.5M9.5 3h5M12 3v3.5"/></svg>
        <span>휴식</span>
      </button>
      <h1 id="title">운동기록</h1>
      <button id="header-action" class="pill" hidden></button>
    </div>
    <div id="subheader"></div>
  </header>

  <main id="view"></main>

  <button id="fab" class="primary fab" hidden>＋ 운동 추가</button>

  <div id="rest" class="rest" hidden>
    <div class="rest-track"><div id="rest-fill" class="rest-fill"></div></div>
    <div class="rest-row">
      <button class="rest-btn" data-rest="-15">−15초</button>
      <div class="rest-time">
        <small id="rest-label">휴식</small>
        <b id="rest-time">0:00</b>
      </div>
      <button class="rest-btn" data-rest="15">+15초</button>
      <button class="rest-btn strong" data-rest="stop">건너뛰기</button>
    </div>
  </div>

  <nav class="tabbar">
    <button class="tab" data-tab="log">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 10v4M5 7v10M8 8v8M8 12h8M16 8v8M19 7v10M22 10v4"/></svg>
      <span>기록</span>
    </button>
    <button class="tab" data-tab="calendar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span>캘린더</span>
    </button>
    <button class="tab" data-tab="export">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span>설정</span>
    </button>
  </nav>

  <div id="sheet" class="sheet" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <input id="restore-input" type="file" accept=".json,application/json" hidden>

  <script src="app.js"></script>
</body>
</html>
